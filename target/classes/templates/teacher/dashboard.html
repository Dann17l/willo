<div class="dashboard-view">
  <h1>Panel del Profesor</h1>
  
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Mis Estudiantes</span>
      <span class="stat-value">148</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Cursos Impartidos</span>
      <span class="stat-value">3</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Consultas Pendientes</span>
      <span class="stat-value">5</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Tareas por Calificar</span>
      <span class="stat-value">12</span>
    </div>
  </div>

  <section class="chart-section" style="margin-top: 40px;">
    <h2>Cursos Activos</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
      <div class="card" style="padding: 20px;">
        <h3 style="margin-bottom: 10px; font-size: 1.1rem; font-weight: 700;">React Moderno</h3>
        <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: 15px;">78 estudiantes inscritos</p>
        <span class="badge badge-default">Activo</span>
      </div>
      <div class="card" style="padding: 20px;">
        <h3 style="margin-bottom: 10px; font-size: 1.1rem; font-weight: 700;">Fundamentos de AWS</h3>
        <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: 15px;">45 estudiantes inscritos</p>
        <span class="badge badge-default">Activo</span>
      </div>
      <div class="card" style="padding: 20px;">
        <h3 style="margin-bottom: 10px; font-size: 1.1rem; font-weight: 700;">Desarrollo Backend con Spring</h3>
        <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: 15px;">25 estudiantes inscritos</p>
        <span class="badge badge-secondary">En preparación</span>
      </div>
    </div>
  </section>
</div>
