<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" th:href="@{/willo.ico}" />
  <title>Recuperar Contraseña — Willo Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <link rel="stylesheet" th:href="@{/auth/login.css}" />
  <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  <style>
    /* Multi-step logic */
    .auth-step {
      display: none;
      animation: authStepIn 0.4s ease forwards;
    }
    .auth-step.is-active {
      display: block;
    }
    @keyframes authStepIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .auth-timer-text {
      text-align: center;
      font-size: 0.85rem;
      color: #616C79;
      margin-top: 16px;
    }
    .auth-timer-text span {
      font-weight: 600;
      color: #223449;
    }
    .auth-timer-resend {
      display: none;
      color: #223449;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-timer-resend:hover {
      text-decoration: underline;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #99A1AA;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    .toggle-password.is-visible {
      color: #223449;
    }
  </style>
</head>

<body>
  <div class="auth-page">
    
    <!-- Left Column (Form) -->
    <div class="auth-col-left">
      <!-- Brand Logo/Text -->
      <div class="auth-brand">
        <a th:href="@{/}">Willo</a>
      </div>

      <!-- Main Form Container -->
      <div class="auth-content-container">
        
        <!-- Header -->
        <div class="auth-header">
          <h1 class="auth-title" id="form-title">Recuperar Contraseña</h1>
          <p class="auth-subtitle" id="form-subtitle">Te enviaremos un código para restablecerla</p>
        </div>

        <!-- Multi-step Form -->
        <form class="auth-form" autocomplete="off" onsubmit="return false;">
          
          <!-- STEP 1: Email Input -->
          <div id="step-email" class="auth-step is-active">
            <div class="auth-input-group">
              <div class="auth-input-wrapper">
                <input type="email" id="email" placeholder="Correo electrónico" required />
              </div>
            </div>
            <button type="button" class="auth-submit" id="btn-send-code">
              <span>Enviar código</span>
            </button>
          </div>

          <!-- STEP 2: Code Verification -->
          <div id="step-code" class="auth-step">
            <div class="auth-input-group">
              <div class="auth-input-wrapper">
                <input type="text" id="verification-code" placeholder="Ej. 123456" maxlength="6" style="letter-spacing: 4px; text-align: center;" required />
              </div>
            </div>
            <button type="button" class="auth-submit" id="btn-verify-code">
              <span>Verificar código</span>
            </button>
            <div class="auth-timer-text">
              <span id="timer-display">01:00</span>
              <a class="auth-timer-resend" id="btn-resend">Reenviar código</a>
            </div>
          </div>

          <!-- STEP 3: New Password -->
          <div id="step-password" class="auth-step">
            <div class="auth-input-group">
              <div class="auth-input-wrapper">
                <input type="password" id="new-password" placeholder="Nueva contraseña" required />
                <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
            
            <div class="auth-input-group" style="margin-top: 12px;">
              <div class="auth-input-wrapper">
                <input type="password" id="confirm-password" placeholder="Confirmar contraseña" required />
                <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="button" class="auth-submit" id="btn-save-password">
              <span>Guardar nueva contraseña</span>
            </button>
          </div>

        </form>

        <div class="auth-divider">
          <span>o</span>
        </div>

        <p class="auth-switch-link" style="text-align: center; font-size: 0.88rem;">
          <a th:href="@{/auth/login}" class="auth-forgot" style="font-size: 0.88rem; font-weight: 600;">Volver al inicio de sesión</a>
        </p>

      </div>

      <!-- Footer at the bottom of the left column -->
      <footer class="auth-footer">
        <span>&copy; 2026 Willo Campus. Todos los derechos reservados.</span>
      </footer>
    </div>

    <!-- Right Column (Illustration) -->
    <div class="auth-col-right">
      <div class="auth-illustration">
        <div class="ill-card ill-card--1"></div>
        <div class="ill-card ill-card--2"></div>
        <div class="ill-card ill-card--3"></div>
        <div class="ill-card ill-card--4"></div>
      </div>
    </div>

  </div>

  <script>
    (function() {
      // UI Elements
      const stepEmail = document.getElementById('step-email');
      const stepCode = document.getElementById('step-code');
      const stepPassword = document.getElementById('step-password');
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');
      
      // Buttons
      const btnSendCode = document.getElementById('btn-send-code');
      const btnVerifyCode = document.getElementById('btn-verify-code');
      const btnSavePassword = document.getElementById('btn-save-password');
      const btnResend = document.getElementById('btn-resend');
      
      // Timer
      const timerDisplay = document.getElementById('timer-display');
      let countdownInterval;

      function startTimer() {
        let timeLeft = 60;
        timerDisplay.style.display = 'inline';
        btnResend.style.display = 'none';
        
        countdownInterval = setInterval(() => {
          timeLeft--;
          let formattedTime = timeLeft < 10 ? `00:0${timeLeft}` : `00:${timeLeft}`;
          timerDisplay.textContent = formattedTime;

          if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            timerDisplay.style.display = 'none';
            btnResend.style.display = 'inline';
          }
        }, 1000);
      }

      // Step 1 -> Step 2
      btnSendCode.addEventListener('click', () => {
        const emailVal = document.getElementById('email').value;
        if (!emailVal) return alert('Por favor ingresa tu correo.');
        
        stepEmail.classList.remove('is-active');
        stepCode.classList.add('is-active');
        title.textContent = 'Revisa tu correo';
        subtitle.textContent = `Hemos enviado un código de 6 dígitos a ${emailVal}`;
        startTimer();
      });

      // Resend Code
      btnResend.addEventListener('click', () => {
        startTimer();
      });

      // Step 2 -> Step 3
      btnVerifyCode.addEventListener('click', () => {
        const codeVal = document.getElementById('verification-code').value;
        if (codeVal.length < 6) return alert('Ingresa el código completo.');

        clearInterval(countdownInterval);
        stepCode.classList.remove('is-active');
        stepPassword.classList.add('is-active');
        title.textContent = 'Nueva contraseña';
        subtitle.textContent = 'Crea una contraseña segura para tu cuenta';
      });

      // Step 3 (Save)
      btnSavePassword.addEventListener('click', () => {
        const p1 = document.getElementById('new-password').value;
        const p2 = document.getElementById('confirm-password').value;
        
        if (!p1 || !p2) return alert('Por favor llena los campos.');
        if (p1 !== p2) return alert('Las contraseñas no coinciden.');
        
        alert('¡Contraseña actualizada con éxito!');
        window.location.href = '/auth/login';
      });

      // Password toggles
      const toggleBtns = document.querySelectorAll('.toggle-password');
      toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const input = btn.previousElementSibling;
          input.type = input.type === 'password' ? 'text' : 'password';
          btn.classList.toggle('is-visible');
        });
      });

      // Input focus effect
      document.querySelectorAll('.auth-input-wrapper input').forEach(input => {
        input.addEventListener('focus', () => input.closest('.auth-input-wrapper').classList.add('is-focused'));
        input.addEventListener('blur', () => input.closest('.auth-input-wrapper').classList.remove('is-focused'));
      });
    })();
  </script>
</body>

</html>
