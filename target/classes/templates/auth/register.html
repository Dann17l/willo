<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" th:href="@{/willo.ico}" />
  <title>Crear Cuenta — Willo Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <link rel="stylesheet" th:href="@{/css/landing.css}" />
  <link rel="stylesheet" th:href="@{/auth/login.css}" />
  <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
</head>

<body>
  <div class="auth-page">
    
    <!-- Columns container -->
    <div class="auth-columns">
      <!-- Left Column (Form) -->
      <div class="auth-col-left">
        <!-- Brand Logo/Text & Theme Toggle -->
        <div class="auth-brand">
          <a th:href="@{/}">Willo</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
            <i class="fa-solid fa-moon icon-moon"></i>
            <i class="fa-solid fa-sun icon-sun"></i>
          </button>
        </div>

      <!-- Main Form Container -->
      <div class="auth-content-container">
        
        <!-- Toggle Tabs -->
        <div class="auth-toggle">
          <a th:href="@{/auth/login}" class="auth-toggle__btn">Iniciar sesión</a>
          <a th:href="@{/auth/register}" class="auth-toggle__btn is-active">Registrarme</a>
        </div>

        <!-- Header -->
        <div class="auth-header">
          <h1 class="auth-title">Crea tu cuenta</h1>
          <p class="auth-subtitle">Regístrate gratis y comienza a aprender</p>
        </div>

        <!-- Error Alert (If any) -->
        <div th:if="${error}" class="auth-alert auth-alert--error">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span th:text="${error}">Error al registrar el usuario.</span>
        </div>

        <!-- Register Form -->
        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="auth-form" autocomplete="off">
          <div class="auth-input-group">
            <div class="auth-input-wrapper">
              <input type="text" id="name" th:field="*{name}" placeholder="Nombre completo" required />
            </div>
          </div>

          <div class="auth-input-group">
            <div class="auth-input-wrapper">
              <input type="email" id="email" th:field="*{email}" placeholder="Correo electrónico" required />
            </div>
          </div>

          <div class="auth-input-group">
            <div class="auth-input-wrapper">
              <input type="password" id="password" th:field="*{password}" placeholder="Contraseña (Mínimo 8 caracteres)" required />
            </div>
          </div>

          <button type="submit" class="auth-submit">
            <span>Continuar</span>
          </button>
        </form>

        <div class="auth-divider">
          <span>o</span>
        </div>

        <!-- Google Login Button -->
        <button class="auth-google-btn" type="button">
          <svg class="auth-google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span>Continuar con Google</span>
        </button>
        <p class="auth-coming-soon">Próximamente disponible</p>

      </div>

      </div>
    </div>

    <!-- Right Column (Illustration) -->
    <div class="auth-col-right">
      <div class="auth-illustration">
        <div class="ill-card ill-card--1"></div>
        <div class="ill-card ill-card--2"></div>
        <div class="ill-card ill-card--3"></div>
        <div class="ill-card ill-card--4"></div>
      </div>
    </div>
    </div> <!-- End auth-columns -->

    <!-- Footer -->
    <div class="auth-footer-container">
      <div th:replace="~{fragments/landing-footer :: footer}"></div>
    </div>

  </div>

  <div th:replace="~{fragments/theme-script :: theme-toggle}"></div>
</body>

</html>
