<div class="login-view">
  <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="auth-form">
    <h2>Crear Cuenta</h2>
    <p th:if="${error}" class="form-error" th:text="${error}"></p>
    <div class="form-group">
      <label for="name">Nombre completo</label>
      <input type="text" id="name" th:field="*{name}" required />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" required />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" th:field="*{password}" required />
    </div>
    <button type="submit" class="btn btn-primary">Crear cuenta</button>
    <p class="auth-link">¿Ya tienes cuenta? <a th:href="@{/auth/login}">Inicia sesión</a></p>
  </form>
</div>
