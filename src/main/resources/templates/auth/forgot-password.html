<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" th:href="@{/willo.ico}" />
  <title>Recuperar Contraseña — Willo Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <link rel="stylesheet" th:href="@{/auth/login.css}" />
  <style>
    /* Multi-step logic */
    .auth-step {
      display: none;
      animation: authStepIn 0.4s ease forwards;
    }
    .auth-step.is-active {
      display: block;
    }
    @keyframes authStepIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .auth-timer-text {
      text-align: center;
      font-size: 0.85rem;
      color: #6B7280;
      margin-top: 16px;
    }
    .auth-timer-text span {
      font-weight: 600;
      color: #8B5CF6;
    }
    .auth-timer-resend {
      display: none;
      color: #8B5CF6;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-timer-resend:hover {
      text-decoration: underline;
    }
  </style>
<link rel="stylesheet" th:href="@{/css/tailwind.css}" />
</head>
<body>
<div class="auth-page">
  <!-- Decorative background -->
  <div class="auth-page__bg">
    <div class="auth-page__blob auth-page__blob--1"></div>
    <div class="auth-page__blob auth-page__blob--2"></div>
  </div>

  <div class="auth-card">
    <!-- Header -->
    <div class="auth-card__header">
      <a th:href="@{/}" class="auth-card__logo">
        <img th:src="@{/willo.ico}" alt="Willo" class="auth-card__logo-img" />
      </a>
      <h1 class="auth-card__title" id="form-title">Recuperar Contraseña</h1>
      <p class="auth-card__subtitle" id="form-subtitle">Te enviaremos un código para restablecerla</p>
    </div>

    <form class="auth-form" autocomplete="off" onsubmit="return false;">
      
      <!-- STEP 1: Email Input -->
      <div id="step-email" class="auth-step is-active">
        <div class="auth-input-group">
          <label for="email" class="auth-label">Correo electrónico</label>
          <div class="auth-input-wrapper">
            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="email" placeholder="tu@email.com" />
          </div>
        </div>
        <button type="button" class="auth-submit" id="btn-send-code" style="margin-top: 12px;">
          <span>Enviar código</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>

      <!-- STEP 2: Code Verification -->
      <div id="step-code" class="auth-step">
        <div class="auth-input-group">
          <label for="verification-code" class="auth-label">Código de verificación</label>
          <div class="auth-input-wrapper">
            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="text" id="verification-code" placeholder="Ej. 123456" maxlength="6" style="letter-spacing: 4px; text-align: center;" />
          </div>
        </div>
        <button type="button" class="auth-submit" id="btn-verify-code" style="margin-top: 12px;">
          <span>Verificar código</span>
        </button>
        <div class="auth-timer-text">
          <span id="timer-display">01:00</span>
          <a class="auth-timer-resend" id="btn-resend">Reenviar código</a>
        </div>
      </div>

      <!-- STEP 3: New Password -->
      <div id="step-password" class="auth-step">
        <div class="auth-input-group">
          <label for="new-password" class="auth-label">Nueva Contraseña</label>
          <div class="auth-input-wrapper">
            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="new-password" placeholder="••••••••" />
            <button type="button" class="auth-toggle-pass toggle-password" aria-label="Mostrar contraseña">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        
        <div class="auth-input-group" style="margin-top: 12px;">
          <label for="confirm-password" class="auth-label">Confirmar Contraseña</label>
          <div class="auth-input-wrapper">
            <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="confirm-password" placeholder="••••••••" />
            <button type="button" class="auth-toggle-pass toggle-password" aria-label="Mostrar contraseña">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="button" class="auth-submit" id="btn-save-password" style="margin-top: 12px;">
          <span>Guardar nueva contraseña</span>
        </button>
      </div>

    </form>

    <div class="auth-divider"><span>o</span></div>

    <p class="auth-switch-link">
      <a th:href="@{/auth/login}">Volver al inicio de sesión</a>
    </p>
  </div>
</div>

<script>
  (function() {
    // UI Elements
    const stepEmail = document.getElementById('step-email');
    const stepCode = document.getElementById('step-code');
    const stepPassword = document.getElementById('step-password');
    const title = document.getElementById('form-title');
    const subtitle = document.getElementById('form-subtitle');
    
    // Buttons
    const btnSendCode = document.getElementById('btn-send-code');
    const btnVerifyCode = document.getElementById('btn-verify-code');
    const btnSavePassword = document.getElementById('btn-save-password');
    const btnResend = document.getElementById('btn-resend');
    
    // Timer
    const timerDisplay = document.getElementById('timer-display');
    let countdownInterval;

    function startTimer() {
      let timeLeft = 60;
      timerDisplay.style.display = 'inline';
      btnResend.style.display = 'none';
      
      countdownInterval = setInterval(() => {
        timeLeft--;
        let formattedTime = timeLeft < 10 ? `00:0${timeLeft}` : `00:${timeLeft}`;
        timerDisplay.textContent = formattedTime;

        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          timerDisplay.style.display = 'none';
          btnResend.style.display = 'inline';
        }
      }, 1000);
    }

    // Step 1 -> Step 2
    btnSendCode.addEventListener('click', () => {
      const email = document.getElementById('email').value;
      if (!email) return alert('Por favor ingresa tu correo.');
      
      stepEmail.classList.remove('is-active');
      stepCode.classList.add('is-active');
      title.textContent = 'Revisa tu correo';
      subtitle.textContent = `Hemos enviado un código de 6 dígitos a ${email}`;
      startTimer();
    });

    // Resend Code
    btnResend.addEventListener('click', () => {
      startTimer();
      // Simulate code resent notification
    });

    // Step 2 -> Step 3
    btnVerifyCode.addEventListener('click', () => {
      const code = document.getElementById('verification-code').value;
      if (code.length < 6) return alert('Ingresa el código completo.');

      clearInterval(countdownInterval);
      stepCode.classList.remove('is-active');
      stepPassword.classList.add('is-active');
      title.textContent = 'Nueva contraseña';
      subtitle.textContent = 'Crea una contraseña segura para tu cuenta';
    });

    // Step 3 (Save)
    btnSavePassword.addEventListener('click', () => {
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      
      if (!p1 || !p2) return alert('Por favor llena los campos.');
      if (p1 !== p2) return alert('Las contraseñas no coinciden.');
      
      // Simulate success and redirect
      alert('¡Contraseña actualizada con éxito!');
      window.location.href = '/auth/login';
    });

    // Password toggles
    const toggleBtns = document.querySelectorAll('.toggle-password');
    toggleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.classList.toggle('is-visible');
      });
    });

    // Input focus effect
    document.querySelectorAll('.auth-input-wrapper input').forEach(input => {
      input.addEventListener('focus', () => input.closest('.auth-input-wrapper').classList.add('is-focused'));
      input.addEventListener('blur', () => input.closest('.auth-input-wrapper').classList.remove('is-focused'));
    });
  })();
</script>
</body>
</html>
