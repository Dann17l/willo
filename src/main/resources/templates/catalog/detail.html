<div class="course-detail-view">
  <a th:href="@{/catalog}" class="btn btn-back">&larr; Volver al catálogo</a>
  <div class="course-detail-header">
    <img th:src="${course.thumbnail} ?: 'https://via.placeholder.com/640x360'" th:alt="${course.title}" />
    <div class="course-detail-info">
      <h1 th:text="${course.title}"></h1>
      <p th:text="${course.description}"></p>
      <span class="course-meta" th:text="${course.duration} + ' · ' + ${course.lessonsCount} + ' lecciones'"></span>
    </div>
  </div>
  <section class="course-lessons">
    <h2>Lecciones</h2>
    <ul th:if="${!course.lessons.isEmpty()}">
      <li class="lesson-item" th:each="l, iter : ${course.lessons}"
          th:onclick="'window.location.href=\'/player/' + [[${course.id}]] + '/' + [[${l.id}]] + '\''">
        <span class="lesson-number" th:text="${iter.index + 1}"></span>
        <div>
          <strong th:text="${l.title}"></strong>
          <span th:text="${l.duration}"></span>
        </div>
      </li>
    </ul>
    <p th:if="${course.lessons.isEmpty()}">No hay lecciones disponibles.</p>
  </section>
</div>
