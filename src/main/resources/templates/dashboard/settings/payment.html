<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" th:href="@{/willo.ico}" />
  <title>Métodos de pago — Configuración Willo Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/landing.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
</head>
<body class="dash-body">

  <div th:replace="~{fragments/dash-nav :: navbar}"></div>

  <div class="dash-container">
    <div th:replace="~{fragments/dash-sidebar :: sidebar('preferences')}"></div>

    <main class="dash-main">
      <div class="settings-layout">
        <!-- Inner Sidebar -->
        <div th:replace="~{fragments/settings-sidebar :: sidebar('payment')}"></div>

        <!-- Content -->
        <div class="settings-content">
          <h2 class="text-3xl font-extrabold mb-2 text-landing-text">Métodos de pago</h2>
          <p class="subtitle mb-8 text-landing-text-secondary">Administra tus tarjetas de crédito y débito.</p>

          <div class="border border-landing-border p-6 rounded-xl bg-landing-surface mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <i class="fa-brands fa-cc-visa text-4xl sm:text-5xl text-landing-text"></i>
              <div>
                <p class="font-bold mb-1 text-landing-text text-lg">Visa terminada en 4242</p>
                <p class="text-landing-text-secondary text-sm">Expira en 12/2028</p>
              </div>
            </div>
            <button type="button" class="landing-btn landing-btn--ghost w-full sm:w-auto text-[#EF4444] hover:bg-[#EF4444]/10"><i class="fa-solid fa-trash mr-2"></i> Eliminar</button>
          </div>

          <button type="button" class="landing-btn landing-btn--primary w-full sm:w-auto text-center"><i class="fa-solid fa-plus mr-2"></i> Añadir nuevo método de pago</button>
        </div>
      </div>

      <div th:replace="~{fragments/dash-footer :: footer}"></div>
    </main>
  </div>

  <div th:replace="~{fragments/dash-scripts :: scripts}"></div>
</body>
</html>
